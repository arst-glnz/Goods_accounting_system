<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.id == null ? 'Новый товар' : 'Изменение товара'} + ' — Складской учёт'">Товар — Складской учёт</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}"><span class="brand-mark">С</span><span>Складской учёт<small>PRODUCT INVENTORY</small></span></a>
        <nav class="main-nav" aria-label="Основная навигация">
            <a class="nav-link" th:href="@{/}">Товары</a>
            <a class="nav-link" th:href="@{/inventory}">Склад</a>
            <a class="nav-link" th:href="@{/orders}">Заказы</a>
            <a class="nav-link" th:href="@{/analytics}" sec:authorize="hasRole('ADMIN')">Аналитика</a>
            <a class="nav-link" th:href="@{/audit}" sec:authorize="hasRole('ADMIN')">Аудит</a>
            <a class="nav-link" th:href="@{/creation-log}" sec:authorize="hasRole('ADMIN')">Создания</a>
        </nav>
        <div class="user-menu">
            <div class="user-info">
                <span class="user-name" sec:authentication="name">Пользователь</span>
                <span class="role-pill" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="role-pill" sec:authorize="hasRole('MANAGER')">MANAGER</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button button-quiet button-small" type="submit">Выйти</button>
            </form>
        </div>
    </div>
</header>
<main class="page-shell page-shell-narrow">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Каталог товаров</p>
            <h1 th:text="${product.id == null ? 'Добавить товар' : 'Изменить товар'}">Товар</h1>
            <p class="muted">Остатки учитываются по вариантам на странице склада</p>
        </div>
    </section>
    <section class="panel form-panel">
        <form th:action="${product.id == null ? '/products' : '/products/' + product.id}"
              th:object="${product}" method="post" class="product-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-field">
                <label for="name">Название</label>
                <input id="name" type="text" th:field="*{name}" maxlength="255" required
                       placeholder="Например, Футболка Basic"
                       th:classappend="${#fields.hasErrors('name') ? 'input-error' : ''}">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</p>
            </div>
            <div class="form-field">
                <label for="price">Цена, ₽</label>
                <input id="price" type="number" th:field="*{price}" min="0.01" step="0.01" required
                       placeholder="0.00"
                       th:classappend="${#fields.hasErrors('price') ? 'input-error' : ''}">
                <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Ошибка</p>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Сохранить</button>
                <a class="button button-secondary" th:href="@{/}">Отмена</a>
            </div>
        </form>
    </section>
</main>
<footer class="site-footer"><span>Складской учёт</span><span>Учебный проект · PostgreSQL</span></footer>
</body>
</html>
