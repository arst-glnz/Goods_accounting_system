<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Товар</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><h1>Товар</h1><a href="/">← К товарам</a></header>
<main>
    <form th:action="${product.id == null ? '/products' : '/products/' + product.id}"
          th:object="${product}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label>Название</label>
        <input type="text" th:field="*{name}">
        <div class="error" th:errors="*{name}"></div>

        <label>Цена</label>
        <input type="number" step="0.01" min="0.01" th:field="*{price}">
        <div class="error" th:errors="*{price}"></div>

        <label>Количество на складе</label>
        <input type="number" min="0" th:field="*{stockQuantity}">
        <div class="error" th:errors="*{stockQuantity}"></div>

        <button type="submit">Сохранить</button>
    </form>
</main>
</body>
</html>
